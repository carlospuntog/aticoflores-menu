# Carta de Ático Flores
#
# Fuente: la carta de Canva (cartataicoflores.my.canva.site), transcrita el
# 26-10-2026. Sustituye a la version anterior, que no se tocaba desde el
# 24-09-2025 y servia precios viejos: focaccia a 6,45 cuando se cobraban 7,
# cappuccino a 2,75 cuando eran 2,90, flat white a 2,80 cuando eran 3,20.
#
# Formato de precio: "0,00 €", con coma decimal, dos decimales y espacio
# antes del simbolo, que es la forma correcta en castellano. Se escribe aqui
# y no se calcula en el javascript, para que lo que se ve sea exactamente lo
# que hay en este fichero.
#
# El campo "image" se queda vacio a proposito: la carta es de texto. Las 67
# fotos siguen en assets/images2/ porque el editor de UltraFlower las usa
# para sus propias vistas previas; aqui no se piden.
#
# Las categorias salen en el orden en que estan escritas. No se reordenan
# por franja horaria: el orden lo decide quien hace la carta.

