- id: desayunos
  name: Nuestros combos de desayuno
  extended_title: Café o infusión incluidos
  image: ''
  active: YES
  time_slot: Desayuno
  priority: true
  note: >-
    Puedes añadir un zumo de naranja por 3,50 €. La oferta se aplica con café
    espresso, americano, café con leche, ColaCao o infusiones de bolsa.
  items:
    - name: Desayuno básico
      description: >-
        Café o infusión, a elegir entre croissant o tostada de mermelada y
        mantequilla.
      price: 4,10 €
    - name: Desayuno clásico
      description: >-
        Café o infusión, a elegir entre tostada de aceite y tomate, croissant
        mixto o croissant a la plancha.
      price: 5,50 €
    - name: Desayuno completo
      description: >-
        Café o infusión, a elegir entre tostada de tomate y jamón, de tomate y
        aguacate o de queso y aguacate.
      price: 7,50 €
    - name: Desayuno Ático
      description: >-
        Café o infusión, a elegir entre tostada de tomate, aguacate y jamón;
        de tomate, aguacate y salmón; de aguacate, tomate y anchoas; de queso
        de cabra, tomate y mortadela de pistacho; o tortitas con fruta y
        mermelada.
      price: 9,50 €

